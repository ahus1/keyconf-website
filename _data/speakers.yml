- key: ewi
  img: ewi.jpg
  name: Erik Jan de Wit
  company: IBM
  bio: |
    Erik Jan de 
    Wit
    is a long-time 
    Keycloak 
    contributor and 
    one of the 
    project’s most 
    active 
    committers, 
    with deep 
    involvement in 
    Keycloak’s 
    JavaScript and 
    TypeScript 
    modernization. 
    Based in Zürich 
    and working at 
    IBM, he has 
    helped shape the 
    React-based 
    Admin and 
    Account 
    consoles, the 
    shared UI 
    component 
    library, and the 
    type-safe Admin 
    Client SDK. In 
    this talk, Erik 
    shares how 
    Keycloak is 
    evolving beyond 
    traditional 
    redirects and 
    toward API-driven, headless 
    authentication 
    patterns that 
    give frontend 
    developers 
    modern DX 
    without 
    sacrificing 
    enterprise-grade 
    security.
  social:
    - url: https://www.linkedin.com/in/erik-jan-de-wit-aba255/
      icon: linkedin-in
    - url: https://github.com/edewit
      icon: github
